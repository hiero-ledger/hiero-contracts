name: Reusable test workflow

on:
  workflow_call:
    inputs:
      testfilter:
        required: true
        type: string
      networkTag:
        required: false
        type: string
      mirrorTag:
        required: false
        type: string
      relayTag:
        required: false
        type: string
      soloVersion:
        required: false
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  acceptance-workflow:
    runs-on: hl-contr-lin-lg
    timeout-minutes: 45
    strategy:
      fail-fast: false

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js [24]
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0

      - name: Initialize test environment variables
        run: cp local.env .env

      - name: Install dependencies
        run: npm ci

      - name: Generate falcon-values config file
        run: |
          cat > .github/falcon.yml <<EOF
          network:
            --consensus-node-version: "${{ inputs.networkTag || 'v0.77.0-rc.6' }}"
            --node-aliases: "node1"
          
          setup:
            --consensus-node-version: "${{ inputs.networkTag || 'v0.77.0-rc.6' }}"
            --node-aliases: "node1"
          
          consensusNode:
            --node-aliases: "node1"
          mirrorNode:
            --enable-ingress: true
            --pinger: true
            --mirror-node-version: "${{ inputs.mirrorTag || 'v0.161.1' }}"
          explorerNode:
            --enable-ingress: true
          relayNode:
            --node-aliases: "node1"
            --values-file: ".github/relay-values.yml"
          EOF

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: kindest/node:v1.32.5@sha256:e3b2327e3a5ab8c76f5ece68936e4cafaa82edf58486b769727ab0b3b97a5b0d
          version: v0.29.0
          kubectl_version: v1.32.5
          verbosity: 3
          wait: 120s

      - name: Start the solo node
        # solo 0.85 forwards the endpoints itself (--external-address); the env
        # vars remap its local ports to the ones the tests expect (see test/config.js).
        env:
          MIRROR_NODE_PORT: 5551
          GRPC_LOCAL_PORT: 50211
          JSON_RPC_RELAY_LOCAL_PORT: 7546
        run: |
          npx @hashgraph/solo@${{ inputs.soloVersion || '0.85.0' }} one-shot falcon deploy \
            --values-file .github/falcon.yml \
            --external-address 0.0.0.0 \
            --dev
        timeout-minutes: 15

      - name: Run the test in ${{ inputs.testfilter }}
        run: npx hardhat test --grep ${{ inputs.testfilter }}
        env:
          HARDHAT_NETWORK: local

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Results (${{ inputs.testfilter }})
          path: test-*.xml

      - name: Publish Test Report
        uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
        if: ${{ !cancelled() }}
        with:
          check_name: 'Unit Tests results' # Set to empty to disable check run
          comment_mode: errors
          json_thousands_separator: ','
          files: 'test-*.xml'

      - name: Stop solo
        if: ${{ !cancelled() }}
        run: npx @hashgraph/solo@${{ inputs.soloVersion || '0.85.0' }} one-shot single destroy
