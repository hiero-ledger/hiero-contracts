name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run-enabled:
        description: 'Perform Dry Run'
        type: boolean
        required: false
        default: true
      version:
        description: 'Release Version (semver ie. 0.24.0). Optional: if provided, it overrides computed version.'
        type: string
        required: false

defaults:
  run:
    shell: bash

permissions:
  actions: read
  checks: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  prepare:
    name: Release / Prepare
    runs-on: hl-contr-lin-lg
    outputs:
      version: ${{ steps.set-outputs.outputs.version }}
      need-release: ${{ steps.set-outputs.outputs.need-release }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Prepare Job
        uses: pandaswhocode/initialize-github-job@ffb7446339e8e6007b942312ac95457d1a20b6cf # 1.0.4
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '24.12.0'
          node-registry: 'https://registry.npmjs.org/'

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release@25.0.2 @semantic-release/git@10.0.1 @semantic-release/github@12.0.2 @semantic-release/exec@7.1.0 gradle-semantic-release-plugin@1.7.6
          npm install -g conventional-changelog-conventionalcommits@9.1.0 @commitlint/cli@18.6.0 @commitlint/config-conventional@18.6.0
          npm install -g marked-mangle@1.1.6 marked-gfm-heading-id@3.1.2 semantic-release-conventional-commits@3.0.0

      - name: Calculate Next Version (default branch)
        id: calculate-version
        working-directory: contracts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          PROCEED="true"
          SEMREL_OUTPUT=""
          # Default branch release
          if [[ "${{ github.event.repository.default_branch }}" == "${{ github.ref_name }}" ]]; then
            if SEMREL_OUTPUT=$( (cd contracts && npx semantic-release --dry-run) 2>&1 ); then
              if echo "${SEMREL_OUTPUT}" | grep -q "The next release version is"; then
                echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release detected a new version"
                # Extract next version from semantic-release output and persist for later steps
                NEXT_VER=$(echo "${SEMREL_OUTPUT}" | sed -n 's/.*The next release version is \([^[:space:]]*\).*/\1/p' | head -n1)
                if [[ -n "${NEXT_VER}" ]]; then
                  echo "${NEXT_VER}" > VERSION
                  echo "::notice::Parsed next version: ${NEXT_VER}"
                fi
              else
                echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release detected NO new version"
                PROCEED="false"
              fi
            else
              echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release did NOT run successfully"
              PROCEED="false"
            fi
          # RC prerelease on branches like rc/*
          elif [[ "${{ github.ref_name }}" == rc/* ]]; then
            if SEMREL_OUTPUT=$( (cd contracts && npx semantic-release --dry-run) 2>&1 ); then
              if echo "${SEMREL_OUTPUT}" | grep -q "The next release version is"; then
                echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release detected a new RC version for branch ${{ github.ref_name }}"
                # Extract next RC version and persist
                NEXT_VER=$(echo "${SEMREL_OUTPUT}" | sed -n 's/.*The next release version is \([^[:space:]]*\).*/\1/p' | head -n1)
                if [[ -n "${NEXT_VER}" ]]; then
                  echo "${NEXT_VER}" > VERSION
                  echo "::notice::Parsed RC next version: ${NEXT_VER}"
                fi
              else
                echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release detected NO RC version for branch ${{ github.ref_name }}"
                PROCEED="false"
              fi
            else
              echo "::notice file=flow-deploy-release-artifact.yaml::Semantic Release did NOT run successfully on RC branch"
              PROCEED="false"
            fi
          else
            if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
              jq -r '.version' './package.json' > VERSION
              PROCEED="true"
            else
              PROCEED="false"
            fi
          fi

          if [[ -n "${SEMREL_OUTPUT}" ]]; then
            echo "::group::SemVer output"
            echo "${SEMREL_OUTPUT}"
            echo "::endgroup::"
          fi

          echo "need-release=${PROCEED}" >> "${GITHUB_OUTPUT}"

      - name: Extract version
        id: set-outputs
        if: ${{ !cancelled() && always() }}
        run: |
          PROCEED="true"
          OUTVER=""

          # 1) If a version was provided via workflow_dispatch input, prefer it
          if [[ -n "${{ inputs.version }}" ]]; then
            RAW_IN="${{ inputs.version }}"
            # Trim whitespace and strip optional leading 'v'
            TRIM_IN=$(echo -n "${RAW_IN}" | tr -d '[:space:]')
            TRIM_IN=${TRIM_IN#v}
            OUTVER="${TRIM_IN}"
            echo "Using provided input version: ${OUTVER}"
          # 2) Else, use the version computed earlier (from semantic-release dry run)
          elif [[ "${{ steps.calculate-version.outputs.need-release }}" == "true" ]] && [[ -f VERSION ]]; then
            cat VERSION
            TRIMMED_VERSION=$(cat VERSION | tr -d '[:space:]')
            OUTVER="${TRIMMED_VERSION}"
            echo "Using computed version from semantic-release: ${TRIMMED_VERSION}"
          # 3) Else, for dry-run and no computed version, fall back to package.json
          elif [[ "${{ steps.calculate-version.outputs.need-release }}" == "true" ]] && [[ "${{ inputs.dry-run-enabled }}" == "true" ]] && [[ ! -f VERSION ]]; then
            VER=$(jq -r '.version' './package.json')
            OUTVER="${VER}"
            echo "Dry run enabled and VERSION file not found, using package.json version: ${VER}"
          else
            PROCEED="false"
          fi

          echo "Version: ${OUTVER}"
          echo "version=${OUTVER}" >> "${GITHUB_OUTPUT}"
          echo "need-release=${PROCEED}" >> "${GITHUB_OUTPUT}"

      - name: Parse Version
        id: version_parser
        uses: step-security/semver-utils@4ae9c1fd6d1c5f8f152fe7e2efe8069a952c2ace # v4.3.2
        with:
          lenient: false
          version: ${{ steps.set-outputs.outputs.version }}

      - name: Set Release Environment Variables
        run: |
          PREMINOR_VERSION=${{ steps.version_parser.outputs.inc-preminor }}
          NEXT_VERSION_SNAPSHOT=${PREMINOR_VERSION//-0/-SNAPSHOT}
          # Determine branch prefix: use 'rc' if the selected version is an RC, otherwise 'release'
          if [[ "${{ steps.set-outputs.outputs.version }}" == *rc* ]] || [[ "${{ steps.version_parser.outputs.prerelease }}" == rc* ]]; then
            BR_PREFIX="rc"
          else
            BR_PREFIX="release"
          fi
          RELEASE_BRANCH="mj-${BR_PREFIX}/${{ steps.version_parser.outputs.major }}.${{ steps.version_parser.outputs.minor }}"
          [[ -z "${{ steps.version_parser.outputs.prerelease }}" ]] && \
            VERSION=${{ steps.version_parser.outputs.release }} || \
            VERSION="${{ steps.version_parser.outputs.release }}-${{ steps.version_parser.outputs.prerelease }}"
          RELEASE_TAG="v${{ steps.set-outputs.outputs.version }}"
          cat >> $GITHUB_ENV <<EOF
          NEXT_VERSION_SNAPSHOT=$NEXT_VERSION_SNAPSHOT
          RELEASE_BRANCH=$RELEASE_BRANCH
          RELEASE_TAG=$RELEASE_TAG
          VERSION=${{ steps.set-outputs.outputs.version }}
          MILESTONE=${{ steps.version_parser.outputs.release}}
          EOF

      - name: Create and Switch to Release Branch
        run: |
          if ! git ls-remote --exit-code --heads --quiet origin refs/heads/${RELEASE_BRANCH}; then
            git checkout -b ${RELEASE_BRANCH}
            git push -u origin ${RELEASE_BRANCH}
          
            # create a PR to bump main branch to the next snapshot version
            echo "CREATE_PR=true" >> $GITHUB_ENV
            echo "PR_TITLE=chore(release): Bump versions for v$NEXT_VERSION_SNAPSHOT" >> $GITHUB_ENV
          else
            git checkout ${RELEASE_BRANCH}
          fi

      - name: Close the Milestone
        if: ${{ steps.version_parser.outputs.prerelease == '' }}
        id: milestone
        uses: step-security/close-milestone@b097272a7aaa0f5c40dc6bc671d45d35c5e85b51 # v2.2.1
        with:
          milestone_name: ${{ steps.version_parser.outputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Notes
        if: ${{ steps.milestone.outputs.milestone_id != '' }}
        uses: step-security/release-notes-generator-action@796ee9c88dd2346ea1a5e9e85ca6cbd1e24e2e6a # v3.2.2
        env:
          FILENAME: ${{ env.RELEASE_NOTES_FILENAME }}
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.milestone_id }}

      - name: Commit and Tag
        uses: step-security/git-auto-commit-action@e2d505468267a3cb406af729d48d664de1f16393 # v6.0.2
        with:
          commit_author: ${{ steps.gpg_importer.outputs.name || vars.GIT_USER_NAME || 'release-automation' }} <${{ steps.gpg_importer.outputs.email || vars.GIT_USER_EMAIL || 'automation@users.noreply.github.com' }}>
          commit_message: 'chore(release): Bump versions for ${{ env.RELEASE_TAG }}'
          commit_options: '--no-verify --signoff'
          commit_user_name: ${{ steps.gpg_importer.outputs.name || vars.GIT_USER_NAME || 'release-automation' }}
          commit_user_email: ${{ steps.gpg_importer.outputs.email || vars.GIT_USER_EMAIL || 'automation@users.noreply.github.com' }}
          tagging_message: ${{ env.RELEASE_TAG }}

      - name: Create Github Release (draft)
        uses: step-security/release-action@03a57407052f15d1537fd5469a6fbbc536aba326 # v1.20.0
        with:
          bodyFile: ${{ env.RELEASE_NOTES_FILENAME }}.md
          commit: ${{ env.RELEASE_BRANCH }}
          draft: true
          name: ${{ env.RELEASE_TAG }}
          omitBody: ${{ steps.milestone.outputs.milestone_id == '' }}
          prerelease: ${{ steps.version_parser.outputs.prerelease != '' }}
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

  create-github-release:
    name: Github / Release
    if: ${{ needs.prepare-release.outputs.need-release == 'true' }}
    runs-on: hl-contr-lin-lg
    needs:
      - prepare
    outputs:
      npm-artifact-name: ${{ steps.set-publish-data.outputs.artifact-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Prepare job
        uses: pandaswhocode/initialize-github-job@ffb7446339e8e6007b942312ac95457d1a20b6cf # 1.0.4
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '24.12.0'
          node-registry: 'https://registry.npmjs.org/'

      - name: Install GnuPG Tools
        run: |
          if ! command -v gpg2 >/dev/null 2>&1; then
            echo "::group::Updating APT Repository Indices"
              sudo apt update
            echo "::endgroup::"
            echo "::group::Installing GnuPG Tools"
              sudo apt install -y gnupg2
            echo "::endgroup::"
          fi

      - name: Import GPG key
        id: gpg_key
        uses: step-security/ghaction-import-gpg@69c854a83c7f79463f8bdf46772ab09826c560cd # v6.3.1
        with:
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false

      - name: Install Semantic Release
        run: |
          npm install -g semantic-release@25.0.2 @semantic-release/git@10.0.1 @semantic-release/github@12.0.2 @semantic-release/exec@7.1.0 gradle-semantic-release-plugin@1.7.6
          npm install -g conventional-changelog-conventionalcommits@9.1.0 @commitlint/cli@18.6.0 @commitlint/config-conventional@18.6.0
          npm install -g marked-mangle@1.1.6 marked-gfm-heading-id@3.1.2 semantic-release-conventional-commits@3.0.0

      - name: Publish Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        if: ${{ !cancelled() && !failure() }}
        working-directory: contracts
        run: |
          FLAGS=""
          if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
            FLAGS="--dry-run"
          fi
          
          npx semantic-release --no-sign ${FLAGS}
          
          if [[ -d "dist" ]]; then
            echo "Dist dir has the following contents:"
            ls dist
          fi

      - name: Update version for dry run
        if: ${{ inputs.dry-run-enabled == true }}
        working-directory: contracts
        run: |
          npm version ${{ needs.prepare-release.outputs.version }} --no-git-tag-version

      - name: Set publish data
        id: set-publish-data
        working-directory: contracts
        run: |
          VERSION=$(jq -r '.version' './package.json')
          CLI_NPM_PACKAGE_NAME="hiero-ledger-hiero-contracts-${VERSION}.tgz"
          echo "artifact-name=${CLI_NPM_PACKAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Pack tarball
        working-directory: contracts
        run: |
          npm pack --pack-destination ./dist

      - name: Verify Package
        working-directory: contracts
        run: |
          EXPECTED="./dist/${{ steps.set-publish-data.outputs.artifact-name }}"
          if [[ ! -f "${EXPECTED}" ]]; then
            echo "::error::Expected package not found: ${EXPECTED}"
            ls -la ./dist/
            exit 1
          fi
          echo "Package verified: ${EXPECTED} ($(du -h "${EXPECTED}" | cut -f1))"

      - name: Upload Hiero Contracts package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: contracts-npm-package
          path: ./contracts/dist/${{ steps.set-publish-data.outputs.artifact-name }}
          if-no-files-found: error

  publish-npm-package:
    name: Publish Hiero Contracts NPM package
    if: ${{ needs.prepare-release.outputs.need-release == 'true' && inputs.dry-run-enabled != true }}
    runs-on: ubuntu-latest
    needs:
      - create-github-release
      - prepare
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Prepare Release
        uses: pandaswhocode/initialize-github-job@ffb7446339e8e6007b942312ac95457d1a20b6cf # 1.0.4
        with:
          checkout: 'true'
          checkout-ref: '${{ github.ref }}'
          checkout-token: '${{ secrets.GITHUB_TOKEN }}'
          setup-node: 'true'
          node-version: '24.12.0'
          node-registry: 'https://registry.npmjs.org/'

      - name: Use Node.js [24]
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.12.0

      - name: Download Hiero Contracts NPM package artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: contracts-npm-package

      - name: Publish Hiero Contracts NPM package
        run: |
          args="--access=public"
          if [[ "${{ inputs.dry-run-enabled }}" == "true" ]]; then
            args="${args} --dry-run"
          else
            args="${args} --provenance"
          fi

          package="${{ needs.create-github-release.outputs.npm-artifact-name }}"
          echo "::group::Publishing package: ${package} with args: ${args}"
          npm publish ${package} ${args}
          echo "::endgroup::"
